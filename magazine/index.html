<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Steps Travel — Nordic & Baltic Escape (Journal)</title>
<meta name="description" content="A magazine-style trip journal — the Nordic & Baltic itinerary as one continuous, photo-led story, city by city.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a1a'/%3E%3Cpath d='M8 22 L14 22 L14 17 L20 17 L20 12 L24 12' stroke='%23e8b95e' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-row">
    <span class="brand">Big Steps <em>Travel</em></span>
    <div class="topbar-actions">
      <button class="pill-btn" id="openReservations">Reservations</button>
      <button class="pill-btn" id="openMap">Map</button>
    </div>
  </div>
</header>

<nav class="city-rail" id="cityRail" aria-label="Jump to city"></nav>

<main id="app"></main>

<dialog id="panel">
  <div class="panel-inner" id="panelBody"></div>
  <button class="panel-close" id="panelClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</dialog>

<dialog id="detailSheet">
  <div class="sheet-inner" id="sheetBody"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</dialog>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
